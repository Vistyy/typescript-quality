allowBuilds:
  # tsx uses esbuild to execute the repository's strictly checked maintenance TypeScript.
  esbuild: true
  # Optional msgpackr native acceleration is unnecessary for configuration validation.
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - '@effect/tsgo-darwin-arm64@0.45.0'
  - '@effect/tsgo-darwin-x64@0.45.0'
  - '@effect/tsgo-linux-arm64@0.45.0'
  - '@effect/tsgo-linux-arm@0.45.0'
  - '@effect/tsgo-linux-x64@0.45.0'
  - '@effect/tsgo-win32-arm64@0.45.0'
  - '@effect/tsgo-win32-x64@0.45.0'
  - '@effect/tsgo@0.45.0'
